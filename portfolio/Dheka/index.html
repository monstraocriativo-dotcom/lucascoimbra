    let currentIndex = 0;

    const modal = document.getElementById('lightbox-modal');
    const modalImg = document.getElementById('modal-image');

    function renderGrid() {
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = '';
      itemsData.forEach((item, index) => {
        const card = document.createElement('article');
        card.className = 'grid-card group relative rounded-2xl bg-surface-container-low border border-outline-variant/30 overflow-hidden cursor-pointer shadow-lg hover:border-primary/50 transition-all duration-300';
        card.setAttribute('onclick', `openLightbox(${index})`);
        card.innerHTML = `
          <div class="relative w-full aspect-square bg-surface-container-highest overflow-hidden">
            <img 
              src="${item.encodedFile}" 
              alt="${item.title}" 
              loading="${index < 6 ? 'eager' : 'lazy'}"
              class="w-full h-full object-cover transition-transform duration-500 ease-out group-hover:scale-105"
            />
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openLightbox(index) {
      currentIndex = index;
      updateModal();
      modal.classList.add('is-open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      modal.classList.remove('is-open');
      document.body.style.overflow = '';
    }

    function updateModal() {
      const item = itemsData[currentIndex];
      modalImg.src = item.encodedFile;
      modalImg.alt = item.title;
    }

    function nextImage(e) {
      if (e) e.stopPropagation();
      currentIndex = (currentIndex + 1) % itemsData.length;
      updateModal();
    }

    function prevImage(e) {
      if (e) e.stopPropagation();
      currentIndex = (currentIndex - 1 + itemsData.length) % itemsData.length;
      updateModal();
    }

    function handleBackdropClick(e) {
      if (e.target === modal || e.target === document.getElementById('lightbox-dialog')) {
        closeLightbox();
      }
    }

    // Navegação via teclado
    window.addEventListener('keydown', (e) => {
      if (!modal.classList.contains('is-open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') nextImage();
      if (e.key === 'ArrowLeft') prevImage();
    });

    // Inicializar Grade
    renderGrid();
  </script>

  <!-- Gerenciador de Reprodução do Vídeo Hero (YouTube Embed + Fallback Local Full HD) -->
  <script>
    (function () {
      var isFile = window.location.protocol === 'file:';
      var ytWrapper = document.getElementById('hero-yt-wrapper');
      var localVideo = document.getElementById('hero-local-video');

      function activateLocalFallback() {
        if (localVideo && ytWrapper) {
          ytWrapper.style.display = 'none';
          localVideo.classList.remove('hidden');
          localVideo.play().catch(function () { });
        }
      }

      if (isFile) {
        activateLocalFallback();
      } else {
        window.onYouTubeIframeAPIReady = function () {
          try {
            new YT.Player('hero-yt-player', {
              events: {
                'onReady': function (event) {
                  event.target.mute();
                  event.target.playVideo();
                  if (typeof event.target.setPlaybackQuality === 'function') {
                    event.target.setPlaybackQuality('hd1080');
                  }
                },
                'onError': function () {
                  activateLocalFallback();
                }
              }
            });
          } catch (e) {
            activateLocalFallback();
          }
        };
      }
    })();
  </script>
