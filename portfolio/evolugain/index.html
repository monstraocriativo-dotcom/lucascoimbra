  <script>
    (function () {
      "use strict";

      // 1. Dados do Carrossel (10 lâminas da pasta carrossel/)
      const CAROUSEL_DATA = {
        type: "carousel",
        id: "carousel-card",
        title: "Carrossel Instagram",
        items: [
          { src: "carrossel/1.jpg", title: "Carrossel — Capa" },
          { src: "carrossel/2.jpg", title: "Carrossel — Lâmina 02" },
          { src: "carrossel/3.jpg", title: "Carrossel — Lâmina 03" },
          { src: "carrossel/4.jpg", title: "Carrossel — Lâmina 04" },
          { src: "carrossel/5.jpg", title: "Carrossel — Lâmina 05" },
          { src: "carrossel/6.jpg", title: "Carrossel — Lâmina 06" },
          { src: "carrossel/7.jpg", title: "Carrossel — Lâmina 07" },
          { src: "carrossel/8.jpg", title: "Carrossel — Lâmina 08" },
          { src: "carrossel/9.jpg", title: "Carrossel — Lâmina 09" },
          { src: "carrossel/10.jpg", title: "Carrossel — Lâmina 10" }
        ]
      };

      // 2. Dados das 8 Peças Únicas
      const SINGLE_POSTS = [
        { id: 1, src: "1.jpg", title: "Post Feed 01" },
        { id: 2, src: "2.jpg", title: "Post Feed 02" },
        { id: 3, src: "3.jpg", title: "Post Feed 03" },
        { id: 4, src: "4.jpg", title: "Post Feed 04" },
        { id: 5, src: "5.jpg", title: "Post Feed 05" },
        { id: 6, src: "6.jpg", title: "Post Feed 06" },
        { id: 7, src: "7.jpg", title: "Post Feed 07" },
        { id: 8, src: "8.jpg", title: "Post Feed 08" }
      ];

      const galleryGrid = document.getElementById("unified-gallery-grid");
      let carouselCurrentIndex = 0;
      const totalCarouselSlides = CAROUSEL_DATA.items.length;

      // ==========================================
      // CRIAÇÃO DO CARD DO CARROSSEL
      // ==========================================
      function createCarouselCard(data) {
        const article = document.createElement("article");
        article.className = "piece-card rounded-3xl bg-surface-container-low border border-brand-gold/40 overflow-hidden group shadow-xl relative";
        article.id = "grid-carousel-card";

        article.innerHTML = `
          <!-- Preview do Slider com Proporção 4:5 e Arrows -->
          <div class="carousel-slider-container relative w-full aspect-[4/5] bg-surface-container-lowest overflow-hidden">
            
            <!-- Track das Lâminas Deslizantes -->
            <div id="card-carousel-track" class="carousel-slide-track">
              ${data.items.map((item, idx) => `
                <div class="carousel-slide-item cursor-pointer">
                  <img 
                    src="${item.src}" 
                    alt="${item.title}" 
                    loading="${idx === 0 ? 'eager' : 'lazy'}" 
                    class="w-full h-full object-cover select-none"
                  />
                  <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/20 pointer-events-none"></div>
                </div>
              `).join('')}
            </div>

            <!-- ARROW ESQUERDA (DESLIZAR ANTERIOR) -->
            <button 
              id="card-arrow-prev" 
              class="absolute left-2.5 top-1/2 -translate-y-1/2 z-20 w-10 h-10 rounded-full bg-black/75 hover:bg-brand-gold hover:text-black text-white backdrop-blur-md border border-white/20 flex items-center justify-center transition-all duration-200 active:scale-90 shadow-2xl cursor-pointer" 
              title="Lâmina anterior"
              aria-label="Lâmina anterior"
            >
              <span class="material-symbols-outlined text-2xl">chevron_left</span>
            </button>

            <!-- ARROW DIREITA (DESLIZAR PRÓXIMO) -->
            <button 
              id="card-arrow-next" 
              class="absolute right-2.5 top-1/2 -translate-y-1/2 z-20 w-10 h-10 rounded-full bg-black/75 hover:bg-brand-gold hover:text-black text-white backdrop-blur-md border border-white/20 flex items-center justify-center transition-all duration-200 active:scale-90 shadow-2xl cursor-pointer" 
              title="Próxima lâmina"
              aria-label="Próxima lâmina"
            >
              <span class="material-symbols-outlined text-2xl">chevron_right</span>
            </button>

            <!-- INDICADORES (DOTS) NA BASE DO PREVIEW -->
            <div class="absolute bottom-3 left-0 right-0 z-10 flex items-center justify-center gap-1.5 px-4 pointer-events-none">
              <div id="card-carousel-dots" class="flex items-center gap-1 bg-black/60 px-2.5 py-1 rounded-full backdrop-blur-sm pointer-events-auto">
                ${data.items.map((_, idx) => `
                  <button 
                    class="carousel-dot w-2 h-2 rounded-full transition-all duration-200 ${idx === 0 ? 'bg-brand-gold w-5' : 'bg-white/40 hover:bg-white/80'}" 
                    data-dot-index="${idx}"
                    aria-label="Ir para o slide ${idx + 1}"
                  ></button>
                `).join('')}
              </div>
            </div>

          </div>
        `;

        // Elementos internos do slider do carrossel
        const track = article.querySelector("#card-carousel-track");
        const prevBtn = article.querySelector("#card-arrow-prev");
        const nextBtn = article.querySelector("#card-arrow-next");
        const dots = article.querySelectorAll(".carousel-dot");

        function updateSlide(newIdx) {
          carouselCurrentIndex = (newIdx + totalCarouselSlides) % totalCarouselSlides;
          track.style.transform = `translateX(-${carouselCurrentIndex * 100}%)`;

          dots.forEach((dot, idx) => {
            if (idx === carouselCurrentIndex) {
              dot.className = "carousel-dot w-5 h-2 rounded-full bg-brand-gold transition-all duration-200";
            } else {
              dot.className = "carousel-dot w-2 h-2 rounded-full bg-white/40 hover:bg-white/80 transition-all duration-200";
            }
          });
        }

        // Eventos das arrows
        prevBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          updateSlide(carouselCurrentIndex - 1);
        });

        nextBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          updateSlide(carouselCurrentIndex + 1);
        });

        // Eventos dos dots
        dots.forEach((dot, idx) => {
          dot.addEventListener("click", (e) => {
            e.stopPropagation();
            updateSlide(idx);
          });
        });

        // Clique no track das imagens abre o lightbox
        track.addEventListener("click", () => {
          openLightbox(data.items, carouselCurrentIndex);
        });

        return article;
      }

      // ==========================================
      // CRIAÇÃO DOS CARDS DE POSTS ÚNICOS
      // ==========================================
      function createSinglePostCard(post, indexInSingles) {
        const article = document.createElement("article");
        article.className = "piece-card rounded-3xl bg-surface-container-low border border-outline-variant/30 overflow-hidden group cursor-pointer shadow-lg";

        article.innerHTML = `
          <!-- Preview com Proporção 4:5 Idêntica — SOMENTE A IMAGEM -->
          <div class="relative w-full aspect-[4/5] bg-surface-container-highest overflow-hidden flex items-center justify-center p-2.5 sm:p-3">
            <img 
              src="${post.src}" 
              alt="${post.title}" 
              loading="lazy" 
              class="w-full h-full object-contain rounded-2xl transition-transform duration-500 group-hover:scale-[1.03]"
            />
            <!-- Overlay com Botão de Zoom -->
            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center rounded-2xl pointer-events-none">
              <div class="w-12 h-12 rounded-full bg-brand-gold text-black flex items-center justify-center shadow-xl transform scale-75 group-hover:scale-100 transition-transform duration-300">
                <span class="material-symbols-outlined text-2xl font-bold">zoom_in</span>
              </div>
            </div>
          </div>
        `;

        article.addEventListener("click", () => {
          openLightbox(SINGLE_POSTS, indexInSingles);
        });

        return article;
      }

      // ==========================================
      // RENDERIZAR TODOS NO MESMO GRID (3 POR LINHA)
      // ==========================================
      function renderUnifiedGrid() {
        galleryGrid.innerHTML = "";

        // 1. Carrossel
        const carouselCard = createCarouselCard(CAROUSEL_DATA);
        galleryGrid.appendChild(carouselCard);

        // 2. Posts únicos
        SINGLE_POSTS.forEach((post, idx) => {
          const card = createSinglePostCard(post, idx);
          galleryGrid.appendChild(card);
        });
      }

      renderUnifiedGrid();

      // ==========================================
      // LIGHTBOX MODAL UNIVERSAL (SOMENTE IMAGEM E FECHAR)
      // ==========================================
      let activeList = [];
      let activeIndex = 0;

      const modal = document.getElementById("lightbox-modal");
      const modalImg = document.getElementById("lightbox-img");
      const closeBtn = document.getElementById("lightbox-close-btn");
      const prevBtn = document.getElementById("lightbox-prev-btn");
      const nextBtn = document.getElementById("lightbox-next-btn");

      function openLightbox(list, index) {
        activeList = list;
        activeIndex = index;
        showModalSlide(activeIndex);
        modal.classList.add("is-open");
        document.body.style.overflow = "hidden";
      }

      function closeLightbox() {
        modal.classList.remove("is-open");
        document.body.style.overflow = "";
      }

      function showModalSlide(index) {
        if (!activeList || activeList.length === 0) return;
        activeIndex = (index + activeList.length) % activeList.length;
        const item = activeList[activeIndex];
        modalImg.src = item.src;
        modalImg.alt = item.title;
      }

      // Controles do Lightbox
      closeBtn.addEventListener("click", closeLightbox);
      prevBtn.addEventListener("click", () => showModalSlide(activeIndex - 1));
      nextBtn.addEventListener("click", () => showModalSlide(activeIndex + 1));

      // Fechar clicando no backdrop
      modal.addEventListener("click", (e) => {
        if (e.target === modal || e.target.id === "lightbox-dialog") {
          closeLightbox();
        }
      });

      // Teclas do Teclado (Esc, Setas)
      document.addEventListener("keydown", (e) => {
        if (!modal.classList.contains("is-open")) return;
        if (e.key === "Escape") closeLightbox();
        if (e.key === "ArrowLeft") showModalSlide(activeIndex - 1);
        if (e.key === "ArrowRight") showModalSlide(activeIndex + 1);
      });

    })();
  </script>

  <!-- Gerenciador de Reprodução do Vídeo Hero (YouTube Embed + Fallback Local Full HD) -->
  <script>
    (function () {
      var isFile = window.location.protocol === 'file:';
      var ytWrapper = document.getElementById('hero-yt-wrapper');
      var localVideo = document.getElementById('hero-local-video');

      function activateLocalFallback() {
        if (localVideo && ytWrapper) {
          ytWrapper.style.display = 'none';
          localVideo.classList.remove('hidden');
          localVideo.play().catch(function () { });
        }
      }

      if (isFile) {
        activateLocalFallback();
      } else {
        window.onYouTubeIframeAPIReady = function () {
          try {
            new YT.Player('hero-yt-player', {
              events: {
                'onReady': function (event) {
                  event.target.mute();
                  event.target.playVideo();
                  if (typeof event.target.setPlaybackQuality === 'function') {
                    event.target.setPlaybackQuality('hd1080');
                  }
                },
                'onError': function () {
                  activateLocalFallback();
                }
              }
            });
          } catch (e) {
            activateLocalFallback();
          }
        };
      }
    })();
  </script>
  <script src="https://www.youtube.com/iframe_api" async defer></script>
