  <!-- SCRIPT DO GRID & LIGHTBOX -->
  <script>
    (function () {
      // 35 imagens renomeadas da pasta posters variados
      const TOTAL_POSTERS = 35;
      const POSTER_ITEMS = Array.from({ length: TOTAL_POSTERS }, (_, i) => ({
        id: i + 1,
        src: `${i + 1}.jpg`,
        title: `Pôster Autoral #${String(i + 1).padStart(2, '0')}`
      }));

      const postersGrid = document.getElementById('posters-grid');
      const modal = document.getElementById('lightbox-modal');
      const modalClose = document.getElementById('lightbox-close');
      const modalPrev = document.getElementById('modal-prev-btn');
      const modalNext = document.getElementById('modal-next-btn');
      const modalWrapper = document.getElementById('modal-media-wrapper');

      let currentIndex = 0;
      let isModalOpen = false;

      // Renderizar o Grid de 3 colunas — SOMENTE AS IMAGENS
      function renderGrid() {
        postersGrid.innerHTML = '';

        POSTER_ITEMS.forEach((item, index) => {
          const card = document.createElement('article');
          card.className = 'poster-card group relative rounded-2xl bg-surface-container-low border border-outline-variant/30 overflow-hidden cursor-pointer flex flex-col shadow-md';
          
          card.innerHTML = `
            <div class="relative w-full aspect-[4/5] bg-surface-container-highest overflow-hidden">
              <img 
                src="${item.src}" 
                alt="${item.title}" 
                loading="${index < 6 ? 'eager' : 'lazy'}"
                class="w-full h-full object-cover object-center transition-transform duration-500 ease-out group-hover:scale-105"
              />
              <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                <div class="w-14 h-14 rounded-full bg-brand-purple/90 text-background flex items-center justify-center shadow-2xl transform scale-75 group-hover:scale-100 transition-transform duration-300">
                  <span class="material-symbols-outlined text-[30px] font-bold">zoom_in</span>
                </div>
              </div>
            </div>
          `;

          card.addEventListener('click', () => {
            openModal(index);
          });

          postersGrid.appendChild(card);
        });
      }

      // Abrir Lightbox
      function openModal(index) {
        currentIndex = index;
        isModalOpen = true;
        modal.classList.add('is-open');
        document.body.classList.add('overflow-hidden');
        updateModal();
      }

      // Fechar Lightbox
      function closeModal() {
        isModalOpen = false;
        modal.classList.remove('is-open');
        document.body.classList.remove('overflow-hidden');
        modalWrapper.innerHTML = '';
      }

      // Atualizar Conteúdo do Lightbox
      function updateModal() {
        const item = POSTER_ITEMS[currentIndex];
        if (!item) return;

        modalWrapper.innerHTML = `
          <img 
            src="${item.src}" 
            alt="${item.title}" 
            class="max-w-[94vw] max-h-[92vh] w-auto h-auto object-contain rounded-xl shadow-2xl transition-opacity duration-200 select-none"
          />
        `;
      }

      function nextSlide() {
        currentIndex = (currentIndex + 1) % POSTER_ITEMS.length;
        updateModal();
      }

      function prevSlide() {
        currentIndex = (currentIndex - 1 + POSTER_ITEMS.length) % POSTER_ITEMS.length;
        updateModal();
      }

      // Eventos
      modalClose.addEventListener('click', closeModal);
      modalNext.addEventListener('click', nextSlide);
      modalPrev.addEventListener('click', prevSlide);

      modal.addEventListener('click', (e) => {
        if (e.target === modal || e.target.id === 'lightbox-dialog') {
          closeModal();
        }
      });

      // Teclado
      window.addEventListener('keydown', (e) => {
        if (!isModalOpen) return;
        if (e.key === 'Escape') closeModal();
        if (e.key === 'ArrowRight') nextSlide();
        if (e.key === 'ArrowLeft') prevSlide();
      });

      // Inicializar Grid
      renderGrid();
    })();
  </script>
  <!-- Gerenciador de Reprodução do Vídeo Hero (YouTube Embed + Fallback Local Full HD) -->
  <script>
    (function () {
      var isFile = window.location.protocol === 'file:';
      var ytWrapper = document.getElementById('hero-yt-wrapper');
      var localVideo = document.getElementById('hero-local-video');

      function activateLocalFallback() {
        if (localVideo && ytWrapper) {
          ytWrapper.style.display = 'none';
          localVideo.classList.remove('hidden');
          localVideo.play().catch(function () { });
        }
      }

      if (isFile) {
        activateLocalFallback();
      } else {
        window.onYouTubeIframeAPIReady = function () {
          try {
            new YT.Player('hero-yt-player', {
              events: {
                'onReady': function (event) {
                  event.target.mute();
                  event.target.playVideo();
                  if (typeof event.target.setPlaybackQuality === 'function') {
                    event.target.setPlaybackQuality('hd1080');
                  }
                },
                'onError': function () {
                  activateLocalFallback();
                }
              }
            });
          } catch (e) {
            activateLocalFallback();
          }
        };
      }
    })();
  </script>
