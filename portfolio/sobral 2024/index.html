  <!-- LÓGICA DA GALERIA, SLIDERS DE 3.5S E MODAL -->
  <script>
    (function () {
      if (typeof PORTFOLIO_PROJECTS === 'undefined' || !PORTFOLIO_PROJECTS.length) {
        console.error('PORTFOLIO_PROJECTS não carregado');
        return;
      }

      // Atualizar badge de estatísticas automaticamente
      const statsBadge = document.getElementById('project-stats');
      if (statsBadge) {
        const totalItemsCount = PORTFOLIO_PROJECTS.reduce((sum, p) => sum + (p.items ? p.items.length : 0), 0);
        statsBadge.textContent = `${PORTFOLIO_PROJECTS.length} Projetos • ${totalItemsCount} Peças`;
      }

      let filteredProjects = [...PORTFOLIO_PROJECTS];
      let appendBatchesCount = 0;

      // Referências do DOM (2 Linhas)
      const trackRows = [
        document.getElementById('track-row-0'),
        document.getElementById('track-row-1')
      ];

      // 1. RENDERIZAR PROJETOS DISTRIBUÍDOS NAS 2 LINHAS
      function renderGallery(projects, isAppend = false) {
        if (!isAppend) {
          trackRows.forEach(t => t.innerHTML = '');
          appendBatchesCount = 0;
        }

        projects.forEach((proj, index) => {
          const absoluteIndex = isAppend ? (appendBatchesCount * filteredProjects.length) + index : index;
          const rowIndex = absoluteIndex % 2;
          const card = createProjectCard(proj, index);
          trackRows[rowIndex].appendChild(card);
        });

        if (isAppend) {
          appendBatchesCount++;
        }

        // Iniciar auto-slide para os cards criados
        initAutoSliders();
      }

      // Normalizador de caminho de mídia
      function fixSrc(src) {
        if (!src) return '';
        return src.replace(/^(\.\.\/)*portfolio\/sobral 2024\//, '');
      }

      // 2. CRIAR ELEMENTO DO CARD DO PROJETO COM ASPECT RATIO DINÂMICO
      function createProjectCard(proj, projIndex) {
        const card = document.createElement('article');
        // Altura 100% da linha para caber em tela única sem nenhum scroll vertical
        card.className = 'project-card flex-shrink-0 relative h-full rounded-2xl bg-surface-container-low border border-outline-variant/30 overflow-hidden group cursor-pointer select-none shadow-md';
        
        // Define o aspect ratio exato para que a largura se adapte perfeitamente
        card.style.aspectRatio = proj.aspectRatio || '9/16';
        card.setAttribute('data-project-index', projIndex);
        card.setAttribute('data-item-count', proj.items.length);

        // Container de Mídias (Slider Interno)
        const mediaContainer = document.createElement('div');
        mediaContainer.className = 'relative w-full h-full overflow-hidden bg-surface-container-highest';

        proj.items.forEach((item, slideIdx) => {
          const slide = document.createElement('div');
          slide.className = `slide-item absolute inset-0 w-full h-full flex items-center justify-center ${slideIdx === 0 ? 'active' : ''}`;
          slide.setAttribute('data-slide-index', slideIdx);

          if (item.isVideo) {
            slide.innerHTML = `
              <video src="${fixSrc(item.src)}" muted playsinline loop autoplay class="w-full h-full object-cover pointer-events-none"></video>
              
            `;
          } else {
            slide.innerHTML = `<img src="${fixSrc(item.src)}" alt="${proj.title}" loading="lazy" class="w-full h-full object-cover"/>`;
          }
          mediaContainer.appendChild(slide);
        });

        // Badge contador de lâminas se tiver mais de 1
        if (proj.items.length > 1) {
          const counterBadge = document.createElement('div');
          counterBadge.className = 'absolute top-2.5 right-2.5 px-2 py-0.5 rounded-full bg-surface-container-lowest/80 backdrop-blur-md border border-outline-variant/30 text-[10px] font-mono text-on-surface-variant flex items-center gap-1';
          counterBadge.innerHTML = `<span class="material-symbols-outlined text-[12px] text-primary">view_carousel</span> <span class="card-counter-text">1/${proj.items.length}</span>`;
          card.appendChild(counterBadge);
        }

        card.appendChild(mediaContainer);

        // Click para abrir Lightbox
        card.addEventListener('click', (e) => {
          if (card.getAttribute('data-prevent-click') === 'true') return;
          openLightbox(projIndex);
        });

        return card;
      }

      // 3. AUTO-SLIDER CONTÍNUO (CROSS-FADE A CADA 3.5 SEGUNDOS)
      let autoSliderTimer = null;
      function initAutoSliders() {
        if (autoSliderTimer) clearInterval(autoSliderTimer);

        autoSliderTimer = setInterval(() => {
          document.querySelectorAll('.project-card').forEach(card => {
            const count = parseInt(card.getAttribute('data-item-count'), 10);
            if (count <= 1) return;

            const slides = card.querySelectorAll('.slide-item');
            let currentIdx = -1;
            slides.forEach((s, idx) => {
              if (s.classList.contains('active')) currentIdx = idx;
            });

            if (currentIdx !== -1) {
              slides[currentIdx].classList.remove('active');
              const nextIdx = (currentIdx + 1) % count;
              slides[nextIdx].classList.add('active');

              const counterText = card.querySelector('.card-counter-text');
              if (counterText) {
                counterText.textContent = `${nextIdx + 1}/${count}`;
              }
            }
          });
        }, 3500);
      }

      // 4. CONTROLE DE SCROLL SUAVE NAS 2 LINHAS
      const galleryContainer = document.getElementById('gallery-container');
      let isHoverPaused = false;
      let isGlobalDragging = false;
      let startX = 0;
      let startScrollPositions = [0, 0];
      let hasDragged = false;
      const autoScrollSpeed = 0.45;
      let interactionPauseTimer = null;

      function pauseAutoScrollTemporarily(ms = 2500) {
        isHoverPaused = true;
        if (interactionPauseTimer) clearTimeout(interactionPauseTimer);
        interactionPauseTimer = setTimeout(() => {
          isHoverPaused = false;
        }, ms);
      }

      function checkInfiniteScroll() {
        trackRows.forEach(track => {
          if (!track) return;
          const maxScroll = track.scrollWidth - track.clientWidth;
          if (track.scrollLeft > maxScroll - 600) {
            renderGallery(filteredProjects, true);
          }
        });
      }

      function setupTrackScrolling() {
        // Inicializa loop com mais cópias para ter scroll contínuo e fluido
        renderGallery(filteredProjects, true);
        renderGallery(filteredProjects, true);

        function autoScrollLoop() {
          if (!isHoverPaused && !isGlobalDragging) {
            trackRows.forEach(t => {
              if (t) t.scrollLeft += autoScrollSpeed;
            });
            checkInfiniteScroll();
          }
          requestAnimationFrame(autoScrollLoop);
        }
        requestAnimationFrame(autoScrollLoop);

        // Pausa no hover para permitir que o usuário analise e clique confortavelmente
        galleryContainer.addEventListener('mouseenter', () => {
          isHoverPaused = true;
          if (interactionPauseTimer) clearTimeout(interactionPauseTimer);
        });

        galleryContainer.addEventListener('mouseleave', () => {
          if (!isGlobalDragging) {
            isHoverPaused = false;
          }
        });

        // Suporte a toque em telas touch
        galleryContainer.addEventListener('touchstart', () => {
          isHoverPaused = true;
        }, { passive: true });

        galleryContainer.addEventListener('touchend', () => {
          pauseAutoScrollTemporarily(1800);
        }, { passive: true });

        // Drag to scroll na área da galeria
        galleryContainer.addEventListener('mousedown', (e) => {
          if (e.target.closest('button')) return;

          isGlobalDragging = true;
          isHoverPaused = true;
          hasDragged = false;
          startX = e.pageX;
          startScrollPositions = trackRows.map(t => t.scrollLeft);
          trackRows.forEach(t => t.classList.add('is-dragging'));
        });

        window.addEventListener('mouseup', () => {
          if (!isGlobalDragging) return;
          isGlobalDragging = false;
          trackRows.forEach(t => t.classList.remove('is-dragging'));
          pauseAutoScrollTemporarily(1200);
          setTimeout(() => {
            document.querySelectorAll('.project-card').forEach(c => c.removeAttribute('data-prevent-click'));
          }, 60);
        });

        window.addEventListener('mousemove', (e) => {
          if (!isGlobalDragging) return;
          const dx = e.pageX - startX;
          if (Math.abs(dx) > 5) {
            hasDragged = true;
            document.querySelectorAll('.project-card').forEach(c => c.setAttribute('data-prevent-click', 'true'));
          }
          trackRows.forEach((t, i) => {
            t.scrollLeft = startScrollPositions[i] - dx;
          });
        });

        // Conversão de scroll da roda do mouse em rolagem horizontal sincronizada
        galleryContainer.addEventListener('wheel', (e) => {
          if (e.deltaY !== 0 && !e.shiftKey) {
            e.preventDefault();
            const delta = e.deltaY * 1.3;
            trackRows.forEach(t => t.scrollLeft += delta);
            checkInfiniteScroll();
            pauseAutoScrollTemporarily(2000);
          }
        }, { passive: false });
      }

      // 5. MODAL LIGHTBOX EXPANSÍVEL EM TELA CHEIA
      const modal = document.getElementById('lightbox-modal');
      const modalCloseBtn = document.getElementById('lightbox-close');
      const modalPrevBtn = document.getElementById('modal-prev-btn');
      const modalNextBtn = document.getElementById('modal-next-btn');
      const modalTitle = document.getElementById('modal-project-title');
      const modalCategory = document.getElementById('modal-category-badge');
      const modalCounter = document.getElementById('modal-slide-counter');
      const modalWrapper = document.getElementById('modal-media-wrapper');
      const modalThumbnailsBar = document.getElementById('modal-thumbnails-bar');

      let curProjectIdx = 0;
      let curSlideIdx = 0;
      let isModalOpen = false;

      function openLightbox(projIndex) {
        curProjectIdx = projIndex;
        curSlideIdx = 0;
        isModalOpen = true;
        isHoverPaused = true;
        modal.classList.add('is-open');
        document.body.classList.add('overflow-hidden');
        updateModalContent();
      }

      function closeLightbox() {
        isModalOpen = false;
        isHoverPaused = false;
        modal.classList.remove('is-open');
        document.body.classList.remove('overflow-hidden');
        const vid = modalWrapper.querySelector('video');
        if (vid) vid.pause();
        modalWrapper.innerHTML = '';
      }

      function updateModalContent() {
        const proj = filteredProjects[curProjectIdx];
        if (!proj) return;

        if (modalTitle) modalTitle.textContent = proj.title;
        modalCategory.textContent = proj.category || 'Sobral 2024';

        const total = proj.items.length;
        if (curSlideIdx < 0) curSlideIdx = total - 1;
        if (curSlideIdx >= total) curSlideIdx = 0;

        if (modalCounter) modalCounter.textContent = `${curSlideIdx + 1} / ${total}`;
        const curItem = proj.items[curSlideIdx];

        // Mídia ampliada em tela cheia com aspect ratio preservado
        modalWrapper.innerHTML = '';
        if (curItem.isVideo) {
          const video = document.createElement('video');
          video.src = fixSrc(curItem.src);
          video.controls = true;
          video.autoplay = true;
          video.playsInline = true;
          video.className = 'max-w-full max-h-full object-contain rounded-xl shadow-2xl';
          modalWrapper.appendChild(video);
        } else {
          const img = document.createElement('img');
          img.src = fixSrc(curItem.src);
          img.className = 'max-w-full max-h-full object-contain rounded-xl shadow-2xl transition-opacity duration-200';
          modalWrapper.appendChild(img);
        }

        // Barra de miniaturas
        if (modalThumbnailsBar) modalThumbnailsBar.innerHTML = '';
        if (total > 1) {
          modalPrevBtn.style.display = 'flex';
          modalNextBtn.style.display = 'flex';

          proj.items.forEach((item, idx) => {
            const thumb = document.createElement('button');
            thumb.className = `w-11 h-11 sm:w-12 sm:h-12 rounded-lg border-2 overflow-hidden shrink-0 transition-all cursor-pointer ${idx === curSlideIdx ? 'border-primary scale-110 shadow-lg' : 'border-outline-variant/40 opacity-50 hover:opacity-100'}`;
            if (item.isVideo) {
              thumb.innerHTML = `<div class="w-full h-full bg-surface-container flex items-center justify-center text-primary text-xs"><span class="material-symbols-outlined text-[16px]">play_circle</span></div>`;
            } else {
              thumb.innerHTML = `<img src="${fixSrc(item.src)}" class="w-full h-full object-cover"/>`;
            }
            thumb.addEventListener('click', () => {
              curSlideIdx = idx;
              updateModalContent();
            });
            if (modalThumbnailsBar) modalThumbnailsBar.appendChild(thumb);
          });
        } else {
          modalPrevBtn.style.display = 'none';
          modalNextBtn.style.display = 'none';
        }
      }

      function nextModalSlide() {
        curSlideIdx++;
        updateModalContent();
      }

      function prevModalSlide() {
        curSlideIdx--;
        updateModalContent();
      }

      // Eventos do modal
      modalCloseBtn.addEventListener('click', closeLightbox);
      modalNextBtn.addEventListener('click', nextModalSlide);
      modalPrevBtn.addEventListener('click', prevModalSlide);

      modal.addEventListener('click', (e) => {
        if (e.target === modal || e.target.id === 'lightbox-dialog') {
          closeLightbox();
        }
      });

      // Atalhos de teclado
      window.addEventListener('keydown', (e) => {
        if (!isModalOpen) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowRight') nextModalSlide();
        if (e.key === 'ArrowLeft') prevModalSlide();
      });

      // Inicialização
      renderGallery(filteredProjects, false);
      setupTrackScrolling();

    })();
  </script>
  <!-- Gerenciador de Reprodução do Vídeo Hero (YouTube Embed + Fallback Local Full HD) -->
  <script>
    (function () {
      var isFile = window.location.protocol === 'file:';
      var ytWrapper = document.getElementById('hero-yt-wrapper');
      var localVideo = document.getElementById('hero-local-video');

      function activateLocalFallback() {
        if (localVideo && ytWrapper) {
          ytWrapper.style.display = 'none';
          localVideo.classList.remove('hidden');
          localVideo.play().catch(function () { });
        }
      }

      if (isFile) {
        activateLocalFallback();
      } else {
        window.onYouTubeIframeAPIReady = function () {
          try {
            new YT.Player('hero-yt-player', {
              events: {
                'onReady': function (event) {
                  event.target.mute();
                  event.target.playVideo();
                  if (typeof event.target.setPlaybackQuality === 'function') {
                    event.target.setPlaybackQuality('hd1080');
                  }
                },
                'onError': function () {
                  activateLocalFallback();
                }
              }
            });
          } catch (e) {
            activateLocalFallback();
          }
        };
      }
    })();
  </script>
  <script src="https://www.youtube.com/iframe_api" async defer></script>
