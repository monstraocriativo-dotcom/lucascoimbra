  <!-- JAVASCRIPT: DADOS E INTERAÇÕES                           -->
  <!-- ======================================================== -->
  <script>
    (function () {
      "use strict";

      // 6 thumbnails presentes na pasta
      const THUMBNAILS_DATA = [
        { id: 1, src: "1.jpg", title: "Mestre do Tempo" },
        { id: 2, src: "2.jpg", title: "Produtividade Sem Stress!" },
        { id: 3, src: "3.jpg", title: "Não Surte Produza!" },
        { id: 4, src: "4.jpg", title: "Fim da Sobrecarga!" },
        { id: 5, src: "5.jpg", title: "Rotina Matinal Eficiente!" },
        { id: 6, src: "6.jpg", title: "Técnicas Produtivas Desvendadas" }
      ];

      const gridContainer = document.getElementById("thumbnails-grid");

      // RENDERIZAR GRID COM 3 POR LINHA — SOMENTE AS IMAGENS
      THUMBNAILS_DATA.forEach((item, index) => {
        const card = document.createElement("article");
        card.className = "thumb-card rounded-3xl bg-surface-container-low border border-outline-variant/30 overflow-hidden group cursor-pointer shadow-lg";
        card.setAttribute("data-index", index);

        card.innerHTML = `
          <!-- Preview da Imagem com Aspect Ratio Adaptado -->
          <div class="relative w-full aspect-[4/3] bg-surface-container-highest overflow-hidden flex items-center justify-center p-2 sm:p-2.5">
            <img 
              src="${item.src}" 
              alt="${item.title}" 
              loading="lazy" 
              class="w-full h-full object-contain rounded-2xl transition-transform duration-500 group-hover:scale-[1.03]"
            />
            
            <!-- Overlay com Botão de Zoom -->
            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center rounded-2xl pointer-events-none">
              <div class="w-12 h-12 rounded-full bg-primary text-white flex items-center justify-center shadow-xl transform scale-75 group-hover:scale-100 transition-transform duration-300">
                <span class="material-symbols-outlined text-2xl font-bold">zoom_in</span>
              </div>
            </div>
          </div>
        `;

        card.addEventListener("click", () => {
          openLightbox(index);
        });

        gridContainer.appendChild(card);
      });

      // ==========================================
      // LIGHTBOX MODAL (SOMENTE IMAGEM E FECHAR)
      // ==========================================
      let activeIndex = 0;
      const modal = document.getElementById("lightbox-modal");
      const modalImg = document.getElementById("lightbox-img");
      const closeBtn = document.getElementById("lightbox-close-btn");
      const prevBtn = document.getElementById("lightbox-prev-btn");
      const nextBtn = document.getElementById("lightbox-next-btn");

      function openLightbox(index) {
        activeIndex = index;
        showSlide(activeIndex);
        modal.classList.add("is-open");
        document.body.style.overflow = "hidden";
      }

      function closeLightbox() {
        modal.classList.remove("is-open");
        document.body.style.overflow = "";
      }

      function showSlide(index) {
        activeIndex = (index + THUMBNAILS_DATA.length) % THUMBNAILS_DATA.length;
        const item = THUMBNAILS_DATA[activeIndex];
        modalImg.src = item.src;
        modalImg.alt = item.title;
      }

      // Eventos dos botões do Lightbox
      closeBtn.addEventListener("click", closeLightbox);
      prevBtn.addEventListener("click", () => showSlide(activeIndex - 1));
      nextBtn.addEventListener("click", () => showSlide(activeIndex + 1));

      // Fechar ao clicar no backdrop
      modal.addEventListener("click", (e) => {
        if (e.target === modal || e.target.id === "lightbox-dialog") {
          closeLightbox();
        }
      });

      // Navegação por teclado (Esc, Setas)
      document.addEventListener("keydown", (e) => {
        if (!modal.classList.contains("is-open")) return;
        if (e.key === "Escape") closeLightbox();
        if (e.key === "ArrowLeft") showSlide(activeIndex - 1);
        if (e.key === "ArrowRight") showSlide(activeIndex + 1);
      });

    })();
  </script>

  <!-- Gerenciador de Reprodução do Vídeo Hero (YouTube Embed + Fallback Local Full HD) -->
  <script>
    (function () {
      var isFile = window.location.protocol === 'file:';
      var ytWrapper = document.getElementById('hero-yt-wrapper');
      var localVideo = document.getElementById('hero-local-video');

      function activateLocalFallback() {
        if (localVideo && ytWrapper) {
          ytWrapper.style.display = 'none';
          localVideo.classList.remove('hidden');
          localVideo.play().catch(function () { });
        }
      }

      if (isFile) {
        activateLocalFallback();
      } else {
        window.onYouTubeIframeAPIReady = function () {
          try {
            new YT.Player('hero-yt-player', {
              events: {
                'onReady': function (event) {
                  event.target.mute();
                  event.target.playVideo();
                  if (typeof event.target.setPlaybackQuality === 'function') {
                    event.target.setPlaybackQuality('hd1080');
                  }
                },
                'onError': function () {
                  activateLocalFallback();
                }
              }
            });
          } catch (e) {
            activateLocalFallback();
          }
        };
      }
    })();
  </script>
